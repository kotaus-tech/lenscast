name: APK и установщик Windows
on:
  push:
  pull_request:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          gradle-version: '8.13'
      - name: Сборка и проверка APK
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Lenscast-Android
          path: android/app/build/outputs/apk/release/app-release.apk
  android-link:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Lenscast-Android
          path: artifacts/android
      - name: Доступ к аппаратной виртуализации
        run: sudo chmod 666 /dev/kvm
      - name: Настоящий Android-сервер, USB-loopback и TLS
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-boot-timeout: 300
          script: python3 .github/scripts/android_link_smoke.py artifacts/android/app-release.apk
      - name: Журнал Android при сбое
        if: failure()
        run: timeout 15s adb logcat -d -s Lenscast:I AndroidRuntime:E || true
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.415'
      - name: Сборка Windows
        run: |
          dotnet restore tests/Lenscast.Tests/Lenscast.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/Lenscast/Lenscast.csproj --no-restore -c Release -o artifacts/windows
      - name: Автоматические проверки протокола
        run: dotnet run --no-restore --project tests/Lenscast.Tests -c Release
      - name: Проверка запуска интерфейса WPF
        shell: pwsh
        run: |
          $p = Start-Process artifacts/windows/Lenscast.exe -ArgumentList '--ci-smoke' -RedirectStandardError artifacts/smoke-stderr.txt -RedirectStandardOutput artifacts/smoke-stdout.txt -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Приложение не завершило проверку запуска' }
          if ($p.ExitCode -ne 0) { throw 'Ошибка загрузки интерфейса WPF' }
      - name: Журнал при ошибке запуска Windows
        if: failure()
        run: python .github/scripts/ci_failure_logs.py
      - name: Компонент USB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://dl.google.com/android/repository/platform-tools_r36.0.2-win.zip' -OutFile "$env:RUNNER_TEMP/adb.zip"
          Expand-Archive "$env:RUNNER_TEMP/adb.zip" "$env:RUNNER_TEMP/adb"
          New-Item -ItemType Directory artifacts/windows/adb
          Copy-Item "$env:RUNNER_TEMP/adb/platform-tools/adb.exe","$env:RUNNER_TEMP/adb/platform-tools/AdbWinApi.dll","$env:RUNNER_TEMP/adb/platform-tools/AdbWinUsbApi.dll","$env:RUNNER_TEMP/adb/platform-tools/NOTICE.txt" artifacts/windows/adb
          Copy-Item docs/THIRD_PARTY.md artifacts/windows
      - name: Установщик Inno Setup 6.4.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = "$env:RUNNER_TEMP/innosetup.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne 'F3C42116542C4CC57263C5BA6C4FEABFC49FE771F2F98A79D2F7628B8762723B') { throw 'Контрольная сумма Inno Setup не совпала' }
          $p = Start-Process $download -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$env:RUNNER_TEMP/inno" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Не удалось подготовить Inno Setup' }
          & "$env:RUNNER_TEMP/inno/ISCC.exe" installer/Lenscast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверка установки и удаления
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/Lenscast-installed"
          $p = Start-Process artifacts/Lenscast-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir/Lenscast.exe") -or -not (Test-Path "$dir/adb/adb.exe")) { throw 'Проверка установки не пройдена' }
          $p = Start-Process "$dir/Lenscast.exe" -ArgumentList '--ci-smoke' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Установленное приложение не отвечает' }
          if ($p.ExitCode -ne 0) { throw 'Установленное приложение не запускается' }
          $rule = Get-NetFirewallRule -DisplayName 'Lenscast: поиск телефона' -ErrorAction Stop
          if ($rule.Profile -ne 'Private' -or $rule.Action -ne 'Allow') { throw 'Неверное правило обнаружения' }
          # Simulate an existing default adb owned by another tool. Uninstall must leave it alone.
          $foreign = "$env:RUNNER_TEMP/other-adb"
          Copy-Item "$dir/adb" $foreign -Recurse
          & "$foreign/adb.exe" -P 5037 kill-server
          & "$foreign/adb.exe" -P 5037 devices
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось подготовить общий adb' }
          $foreignExe = (Get-Item "$foreign/adb.exe").FullName
          $foreignProcess = Get-Process adb -ErrorAction Stop | Where-Object { $_.Path -eq $foreignExe } | Select-Object -First 1
          if (-not $foreignProcess) { throw 'Не запущен контрольный adb другого приложения' }
          & "$dir/adb/adb.exe" -P 5038 devices
          if ($LASTEXITCODE -ne 0) { throw 'Компонент USB не запускается' }
          $p = Start-Process "$dir/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$dir/Lenscast.exe") -or (Test-Path "$dir/adb/adb.exe")) { throw 'Проверка удаления не пройдена' }
          if (Get-NetFirewallRule -DisplayName 'Lenscast: поиск телефона' -ErrorAction SilentlyContinue) { throw 'Правило обнаружения не удалено' }
          if (-not (Get-Process -Id $foreignProcess.Id -ErrorAction SilentlyContinue)) { throw 'Удаление затронуло общий adb другого приложения' }
          & "$foreign/adb.exe" -P 5037 kill-server
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Lenscast-Windows
          path: artifacts/Lenscast-Setup.exe
  release:
    needs: [android, windows, android-link]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Публикация проверенной сборки
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA::12}"
          gh release create "$tag" artifacts/app-release.apk artifacts/Lenscast-Setup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lenscast · ${GITHUB_SHA::7}" --notes "Сборка для личной проверки. Инструкции и ограничения — в README и docs/HARDWARE_TEST.md." --prerelease
